<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دليل أوامر بوت تون</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .glass {
            background: var(--tg-theme-secondary-bg-color, rgba(30, 41, 59, 0.7));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .active-category {
            background: var(--tg-theme-button-color, #3b82f6) !important;
            color: var(--tg-theme-button-text-color, #ffffff) !important;
            transform: scale(1.05);
        }
        .command-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .command-card:active {
            transform: scale(0.96);
            background: var(--tg-theme-button-color, #3b82f6);
            opacity: 0.9;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="sticky top-0 z-50 glass px-4 py-4 shadow-xl border-b border-white/5">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-cyan-500 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fas fa-robot text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold leading-none">بوت تون</h1>
                    <p class="text-[10px] text-blue-400 font-bold opacity-80">التحكم الذكي بالمجموعات</p>
                </div>
            </div>
            <div id="userInfo" class="flex items-center gap-2 bg-white/5 px-3 py-1.5 rounded-full">
                <span id="userName" class="text-xs font-bold">زائر</span>
            </div>
        </div>
        
        <div class="relative">
            <input type="text" id="searchInput" placeholder="ابحث عن أمر محدد..." 
                class="w-full bg-slate-900/40 border border-white/10 rounded-2xl py-3 px-12 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-all shadow-inner">
            <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
        </div>
    </header>

    <nav id="tabs" class="flex overflow-x-auto p-4 gap-3 no-scrollbar sticky top-[136px] z-40 bg-transparent">
        <button onclick="filter('all', this)" class="cat-btn active-category whitespace-nowrap px-5 py-2 rounded-xl text-xs font-bold glass transition-all shadow-md">الكل</button>
        <button onclick="filter('locks', this)" class="cat-btn whitespace-nowrap px-5 py-2 rounded-xl text-xs font-bold glass transition-all shadow-md">الأقفال</button>
        <button onclick="filter('toggles', this)" class="cat-btn whitespace-nowrap px-5 py-2 rounded-xl text-xs font-bold glass transition-all shadow-md">التفعيل</button>
        <button onclick="filter('admin', this)" class="cat-btn whitespace-nowrap px-5 py-2 rounded-xl text-xs font-bold glass transition-all shadow-md">الإشراف</button>
        <button onclick="filter('games', this)" class="cat-btn whitespace-nowrap px-5 py-2 rounded-xl text-xs font-bold glass transition-all shadow-md">الألعاب</button>
        <button onclick="filter('ranks', this)" class="cat-btn whitespace-nowrap px-5 py-2 rounded-xl text-xs font-bold glass transition-all shadow-md">الرتب</button>
        <button onclick="filter('general', this)" class="cat-btn whitespace-nowrap px-5 py-2 rounded-xl text-xs font-bold glass transition-all shadow-md">عام</button>
    </nav>

    <main class="px-4 mt-2">
        <div id="commandsGrid" class="grid grid-cols-1 gap-3">
            <!-- سيتم ملء هذا القسم برمجياً -->
        </div>

        <div id="noResults" class="hidden flex flex-col items-center justify-center py-20 opacity-40">
            <i class="fas fa-search-minus text-5xl mb-4"></i>
            <p>لا يوجد نتائج مطابقة</p>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] bg-blue-600 text-white px-6 py-3 rounded-2xl shadow-2xl transition-all duration-300 translate-y-32 opacity-0 flex items-center gap-3">
        <div class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></div>
        <span class="text-sm font-bold">جاري تنفيذ الأمر...</span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        if (tg.initDataUnsafe?.user) {
            document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
        }

        // قاعدة بيانات الأوامر الضخمة بناءً على طلبك
        const commandsData = [
            // الأقفال
            { cat: 'locks', title: 'قفل الكل', cmd: 'قفل الكل' },
            { cat: 'locks', title: 'دخول الايراني', cmd: 'قفل دخول الايراني' },
            { cat: 'locks', title: 'الروابط', cmd: 'قفل الروابط' },
            { cat: 'locks', title: 'الوسائط', cmd: 'قفل الوسائط' },
            { cat: 'locks', title: 'المتحركة بالطرد', cmd: 'قفل المتحركه بالطرد' },
            { cat: 'locks', title: 'التعديل', cmd: 'قفل التعديل' },
            { cat: 'locks', title: 'البوتات', cmd: 'قفل البوتات' },
            // التفعيل
            { cat: 'toggles', title: 'المتفاعلين', cmd: 'تفعيل المتفاعلين' },
            { cat: 'toggles', title: 'كيبورد البنك', cmd: 'تفعيل كيبورد البنك' },
            { cat: 'toggles', title: 'الألعاب', cmd: 'تفعيل الالعاب' },
            { cat: 'toggles', title: 'الردود', cmd: 'تفعيل الردود' },
            { cat: 'toggles', title: 'الترحيب', cmd: 'تفعيل الترحيب' },
            // الإشراف
            { cat: 'admin', title: 'كشف المجموعة', cmd: 'كشف المجموعة' },
            { cat: 'admin', title: 'كتم الكل', cmd: 'كتم الكل' },
            { cat: 'admin', title: 'رفع المشرفين', cmd: 'رفع المشرفين' },
            { cat: 'admin', title: 'قائمة المنع', cmd: 'قائمة المنع' },
            { cat: 'admin', title: '@all منشن للكل', cmd: '@all' },
            // الألعاب
            { cat: 'games', title: 'لعبة أمثلة', cmd: 'امثله' },
            { cat: 'games', title: 'كت تويت', cmd: 'كت تويت' },
            { cat: 'games', title: 'لعبة البنك', cmd: 'البنك' },
            { cat: 'games', title: 'توب النقاط', cmd: 'توب النقاط' },
            { cat: 'games', title: 'حجرة ورقة مقص', cmd: 'حجره' },
            // الرتب
            { cat: 'ranks', title: 'رفع مالك', cmd: 'رفع مالك' },
            { cat: 'ranks', title: 'رفع مدير', cmd: 'رفع مدير' },
            { cat: 'ranks', title: 'المميزين', cmd: 'المميزين' },
            // عام
            { cat: 'general', title: 'ايدي', cmd: 'ايدي' },
            { cat: 'general', title: 'نسبة جمالي', cmd: 'نسبة جمالي' },
            { cat: 'general', title: 'غني لي', cmd: 'غني' }
        ];

        const grid = document.getElementById('commandsGrid');
        const search = document.getElementById('searchInput');

        function render(items) {
            grid.innerHTML = '';
            if(items.length === 0) {
                document.getElementById('noResults').classList.remove('hidden');
                return;
            }
            document.getElementById('noResults').classList.add('hidden');

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'command-card glass p-4 rounded-2xl flex items-center justify-between cursor-pointer';
                card.innerHTML = `
                    <div class="flex flex-col gap-1">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full ${getColor(item.cat)}"></span>
                            <span class="text-[10px] uppercase font-bold opacity-60 tracking-tighter">${item.cat}</span>
                        </div>
                        <h3 class="font-extrabold text-[15px]">${item.title}</h3>
                        <code class="text-[11px] text-blue-400 font-mono">${item.cmd}</code>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center">
                        <i class="fas fa-chevron-left text-[10px] opacity-30"></i>
                    </div>
                `;
                card.onclick = () => sendCommand(item.cmd);
                grid.appendChild(card);
            });
        }

        function getColor(cat) {
            const colors = { locks: 'bg-red-500', toggles: 'bg-green-500', admin: 'bg-purple-500', games: 'bg-yellow-500', ranks: 'bg-blue-500' };
            return colors[cat] || 'bg-slate-500';
        }

        function sendCommand(cmd) {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-32', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                try {
                    // إرسال البيانات للبوت
                    tg.sendData(cmd);
                } catch (e) {
                    // في حال التجربة خارج تليجرام
                    copyText(cmd);
                    toast.querySelector('span').innerText = "تم النسخ (خارج تليجرام)";
                }
                
                setTimeout(() => {
                    toast.classList.add('translate-y-32', 'opacity-0');
                    if(tg.close) tg.close();
                }, 800);
            }, 400);
        }

        function filter(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active-category'));
            btn.classList.add('active-category');
            if(cat === 'all') render(commandsData);
            else render(commandsData.filter(i => i.cat === cat));
        }

        search.oninput = (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = commandsData.filter(i => 
                i.title.toLowerCase().includes(val) || i.cmd.toLowerCase().includes(val)
            );
            render(filtered);
        };

        function copyText(text) {
            const input = document.createElement('textarea');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
        }

        // التشغيل الأولي
        render(commandsData);
    </script>
</body>
</html>
